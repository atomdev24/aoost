# aoost CMS: one Worker serves the public site (static assets), /admin, /api/* and /mcp.
# Preview deploys only (*.workers.dev). Never add routes or custom domains here.
name = "aoost-cms"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# The Worker runs first for everything that needs auth or is dynamic.
run_worker_first = ["/admin", "/admin/*", "/api/*", "/mcp", "/mcp/*", "/media/*", "/preview", "/preview/*"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aoost-media"

[[durable_objects.bindings]]
name = "DRAFT"
class_name = "DraftStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DraftStore"]

[vars]
# "password" (EDITOR_PASSWORD secret) or "access" (Cloudflare Access JWT). See docs/auth.md.
AUTH_MODE = "password"
# Only used when AUTH_MODE = "access".
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
GITHUB_REPO = "atomdev24/aoost"
PUBLISH_BRANCH = "cms-v1"

# Secrets (wrangler secret put / .dev.vars): EDITOR_PASSWORD, GITHUB_TOKEN
