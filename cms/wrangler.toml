# aoost CMS: one Worker serves the public site (static assets), /admin, /api/* and /mcp.
# Serves alexoostendurp.com and www (custom domains) plus the *.workers.dev preview.
name = "aoost-cms"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "alexoostendurp.com", custom_domain = true },
  { pattern = "www.alexoostendurp.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# The Worker runs first for everything that needs auth or is dynamic.
# Every request reaches the Worker first so www can forward to the plain address; public pages are handed straight to the static assets.
run_worker_first = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aoost-media"

[[durable_objects.bindings]]
name = "DRAFT"
class_name = "DraftStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DraftStore"]

# The public demo editor's draft (/demo/), kept apart from the real one.
[[durable_objects.bindings]]
name = "DEMO"
class_name = "DemoStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DemoStore"]

# 01:00 UTC = 03:00 in Cape Town: the demo editor goes back to its wireframe site.
[triggers]
# 01:00 UTC (03:00 Cape Town): the demo reset. Every 15 minutes: scheduled releases (EDITOR-RELEASES.md).
crons = ["0 1 * * *", "*/15 * * * *"]

[vars]
# "password" (EDITOR_PASSWORD secret) or "access" (Cloudflare Access JWT). See docs/auth.md.
AUTH_MODE = "access"
# Only used when AUTH_MODE = "access".
ACCESS_TEAM_DOMAIN = "rapid-cake-bd62.cloudflareaccess.com"
ACCESS_AUD = "8274ee917aeec4c517c1ddabc3f660e31bf17c7566644f500bb591bcdcb780db"
GITHUB_REPO = "atomdev24/aoost"
PUBLISH_BRANCH = "main"

# Secrets (wrangler secret put / .dev.vars): EDITOR_PASSWORD, GITHUB_TOKEN
